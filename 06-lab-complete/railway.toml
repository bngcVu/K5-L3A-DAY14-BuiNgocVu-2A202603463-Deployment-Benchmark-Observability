[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand: dùng CMD trong Dockerfile (nghe theo biến PORT).
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Đặt trên dashboard, không ghi vào file: AGENT_API_KEY, REDIS_URL
